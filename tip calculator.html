<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium super fastest and famous Tip Calculator</title>
    <link rel="stylesheet" href="tip calculator.css">
</head>
<body>
    <div class="calculator-card">
        <h2>Tip Calculator</h2>
        
        <div class="input-group">
            <label for="billAmount">Bill Amount</label>
            <div class="input-field">
                <span class="currency">$</span>
                <input type="number" id="billAmount" placeholder="0.00" step="0.01">
            </div>
        </div>

        <div class="input-group">
            <label for="tipPercentage">Tip Percentage (%)</label>
            <input type="number" id="tipPercentage" placeholder="15" value="15">
        </div>

        <div class="input-group">
            <label for="numPeople">Number of People</label>
            <input type="number" id="numPeople" placeholder="1" value="1">
        </div>

        <div class="button-group">
            <button id="calculateBtn" class="btn-primary">Calculate</button>
            <button id="resetBtn" class="btn-secondary">Reset</button>
        </div>

        <div class="results-container">
            <div class="result-box">
                <p class="label">Tip / Person</p>
                <p class="value" id="tipPerPerson">$0.00</p>
            </div>
            <div class="result-box total">
                <p class="label">Total / Person</p>
                <p class="value" id="totalPerPerson">$0.00</p>
            </div>
        </div>
    </div>

    <script src="tip calculator.js"></script>
</body>
</html>
